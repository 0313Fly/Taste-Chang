<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>常州美食排行榜</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <div id="app">
    <div class="wrap">
      <h1>[[ title ]]</h1>
      <p class="sub">按评分排序 · 同分优先展示打卡次数更多的店</p>
      <form class="search" @submit.prevent="onSearch">
        <input
          v-model="query"
          type="search"
          placeholder="搜索饭店名称…"
          autocomplete="off"
        >
        <button type="submit">搜索</button>
      </form>
      <p v-if="error" class="error">[[ error ]]</p>
      <div class="card">
        <table>
          <thead>
            <tr>
              <th class="rank">排名</th>
              <th>饭店</th>
              <th class="score">评分</th>
              <th class="count">次数</th>
            </tr>
          </thead>
          <tbody>
            <tr v-if="loading">
              <td colspan="4" class="empty">加载中…</td>
            </tr>
            <tr v-else-if="!items.length">
              <td colspan="4" class="empty">没有匹配的饭店</td>
            </tr>
            <tr v-for="row in rankedItems" :key="row.name">
              <td class="rank">[[ row.medal ]]</td>
              <td class="name">[[ row.name ]]</td>
              <td class="score">[[ row.score.toFixed(1) ]]</td>
              <td class="count">[[ row.count == null ? '—' : row.count + ' 次' ]]</td>
            </tr>
          </tbody>
        </table>
      </div>
      <p class="meta">
        共 [[ items.length ]] 家 · API:
        <a href="/api/restaurants">/api/restaurants</a>
      </p>
    </div>
  </div>
  <script src="{{ url_for('static', filename='js/vue.global.prod.js') }}"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
